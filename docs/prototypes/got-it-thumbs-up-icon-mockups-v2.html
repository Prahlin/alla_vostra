<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Got It Icon Mockups V2</title>
  <style>
    :root {
      color-scheme: light;
      --black: #111111;
      --cream: #fff8ec;
      --orange: #e6a04d;
      --orange-light: #ffc878;
      --orange-mid: #f7b967;
      --orange-deep: #d9953f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #1f1b18;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .mockups {
      width: min(430px, 100%);
      display: grid;
      gap: 18px;
    }

    .mockup {
      position: relative;
      height: 218px;
      overflow: hidden;
      border: 3px solid var(--black);
      border-radius: 8px;
      background: var(--cream);
      box-shadow:
        0 14px 28px rgba(0, 0, 0, 0.28),
        6px 7px 0 rgba(17, 17, 17, 0.2);
    }

    .mockup::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 28px;
      border-top: 3px solid var(--black);
      background: linear-gradient(180deg, var(--orange-deep), var(--orange-mid) 52%, var(--orange-light));
    }

    .slot-line {
      position: absolute;
      right: 0;
      bottom: 79px;
      left: 0;
      height: 1px;
      opacity: 0.12;
      background: var(--black);
    }

    .got-it {
      position: absolute;
      left: 50%;
      bottom: 50px;
      width: 126px;
      height: 56px;
      transform: translateX(-50%);
      border: 2px solid var(--black);
      border-radius: 11px;
      background: linear-gradient(180deg, var(--orange-light), var(--orange-mid) 52%, var(--orange-deep));
      box-shadow:
        2px 3px 0 rgba(17, 17, 17, 0.09),
        1px 2px 5px rgba(17, 17, 17, 0.18);
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
      overflow: hidden;
    }

    .got-it::before,
    .got-it::after {
      content: "";
      position: absolute;
      right: 0;
      left: 0;
      height: 3px;
      background: #fffcf2;
      border-color: rgba(17, 17, 17, 0.28);
      border-style: solid;
      border-width: 0;
    }

    .got-it::before {
      top: 0;
      border-bottom-width: 0.375px;
    }

    .got-it::after {
      bottom: 0;
      border-top-width: 0.375px;
    }

    .icon-slot {
      position: absolute;
      left: calc(75% + 31.5px);
      bottom: 18px;
      width: 124px;
      height: 124px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
    }

    .icon {
      width: 124px;
      height: 124px;
      overflow: visible;
    }

    .icon-option-e-final {
      width: 99.2px;
      height: 99.2px;
    }

    .stroke {
      fill: #ffffff;
      stroke: var(--black);
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line {
      fill: none;
      stroke: var(--black);
      stroke-width: 3.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .detail {
      fill: none;
      stroke: var(--black);
      stroke-width: 2.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orange-line {
      fill: none;
      stroke: var(--orange);
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .orange-fill {
      fill: var(--orange);
      stroke: var(--black);
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label {
      position: absolute;
      top: 13px;
      left: 14px;
      color: rgba(17, 17, 17, 0.45);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="mockups" aria-label="Got It thumbs-up icon mockups version two">

    </section>

    <section class="mockup">

      <div class="got-it">Got It!</div>
      <div class="icon-slot">
        <svg class="icon icon-option-e-final" viewBox="0 0 96 96" role="img" aria-label="Closed-eye smiley with refined thumbs up option E">

            <path class="stroke" d="M42.8 56.2H52.8V76.2H42.8C39.7 76.2 37.2 73.7 37.2 70.6V61.8C37.2 58.7 39.7 56.2 42.8 56.2Z" style="fill: url(#optionEHandGradient)"></path>
            <path class="detail" d="M70 55.6H82M68.5 61.7H79.2M66.3 67.8H75.4"></path>
            <path class="detail" d="M61.8 49.6C64 52.8 67.6 53.5 70.9 50.2"></path>
          </g>
        </svg>
      </div>
    </section>

    <section class="mockup">
      <div class="label">Option F</div>
      <div class="slot-line"></div>
      <div class="got-it">Got It!</div>
      <div class="icon-slot">
        <svg class="icon" viewBox="0 0 96 96" role="img" aria-label="Closed-eye smiley with refined thumbs up option F">
          <ellipse cx="52" cy="86" rx="30" ry="5" fill="#000000" opacity="0.16"></ellipse>
          <path class="orange-line" d="M18 58C13 44 18 29 31 20"></path>
          <path class="orange-line" d="M62 18C74 23 82 36 81 50"></path>
          <g transform="rotate(-3 39 43)">
            <circle class="stroke" cx="38" cy="41" r="25"></circle>
            <path class="line" d="M28 36C30.1 33.9 33.3 33.9 35.4 36"></path>

          <g transform="rotate(12 66 56)">

      </div>
    </section>
  </main>
</body>
</html>
